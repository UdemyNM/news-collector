name: test

# main に向けた PR で、単体テストを実行する
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 依存ライブラリをインストール
        run: python -m pip install -e ".[dev]"

      - name: 単体テストを実行
        run: python -m pytest -v
